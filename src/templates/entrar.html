{% extends "base.html" %}
{% block titulo %}Entrar | MercadoSimples{% endblock %}

{% block conteudo %}
<div class="painel-caixa formulario-central">
    <h1 style="margin-bottom: 0.4rem;">Entrar na Conta</h1>
    <p class="subtitulo" style="margin-bottom: 1.4rem;">Acesse sua conta de cliente ou anunciante.</p>

    <form method="post" action="{{ url_for('autenticacao.entrar') }}">
        <div class="grupo-campo">
            <label for="campo-email">E-mail</label>
            <input
                id="campo-email"
                type="email"
                name="email"
                value="{{ email }}"
                placeholder="seu@email.com"
                required
            >
        </div>

        <div class="grupo-campo">
            <label for="campo-senha">Senha</label>
            <input
                id="campo-senha"
                type="password"
                name="senha"
                placeholder="Sua senha"
                required
            >
        </div>

        <button type="submit" class="botao botao-primario botao-bloco">Entrar</button>
    </form>

    <p style="margin-top: 1.2rem; text-align: center; font-size: 0.92rem;">
        Ainda não possui conta? <a href="{{ url_for('autenticacao.cadastro') }}">Cadastre-se gratuitamente</a>
    </p>
</div>
{% endblock %}
